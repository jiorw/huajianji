name: 构建无签名 IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    # 这个仓库里还放着「必起闹钟」的 workflow，两条都是 on: push 的话
    # 我每推一个文件，两个项目各跑一次 macOS runner。限定只认自己的路径。
    paths:
      - "Sources/**"
      - "Support/**"
      - "Assets.xcassets/**"
      - "project.yml"
      - ".github/workflows/build-ipa.yml"

jobs:
  build:
    # 必须钉 macos-26：默认 Xcode 26.6 带 iOS 26 SDK，才有 glassEffect 这些 Liquid Glass API
    # macos-latest 目前默认还是 Xcode 16.x，编译会直接报找不到 API
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: 确认工具链版本
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -showsdks | grep -q 'iphoneos2[6-9]' || {
            echo "!! 需要 Xcode 26 或更新（iOS 26 SDK 才有 Liquid Glass API），当前 runner 不满足"; exit 1; }

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 写入构建号
        run: |
          set -euo pipefail
          # 把 run 号写进 CFBundleVersion，App 里就能看到自己装的是哪一次构建
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Support/Info.plist
          echo "CFBundleVersion -> $(plutil -extract CFBundleVersion raw Support/Info.plist)"

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译 Release（不签名）
        run: |
          set -euo pipefail
          # -target 模式下不能用 -derivedDataPath，直接指定 SYMROOT
          xcodebuild build \
            -project HuajianJi.xcodeproj \
            -target HuajianJi \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$(pwd)/build_out" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=

      - name: 打包成 IPA
        run: |
          set -euo pipefail
          VERSION=$(plutil -extract CFBundleShortVersionString raw Support/Info.plist)
          BUILD=$(plutil -extract CFBundleVersion raw Support/Info.plist)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "版本号 $VERSION ($BUILD)"
          APP=$(find build_out/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          test -n "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          ditto -c -k --keepParent Payload "huajianji-$VERSION.ipa"
          ls -lh "huajianji-$VERSION.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: huajianji-${{ env.VERSION }}
          path: huajianji-${{ env.VERSION }}.ipa
          if-no-files-found: error
