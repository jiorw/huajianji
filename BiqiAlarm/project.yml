name: BiqiAlarm
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    # Swift 5 模式：AVFoundation / Vision 的回调式 API 在 Swift 6 严格并发下会报一堆并发错
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    ARCHS: "arm64"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    # 不签名：产物交给手机端自签工具
    CODE_SIGN_STYLE: "Manual"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  BiqiAlarm:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
      # 铃声平铺进 bundle 根目录，Bundle.main.url(forResource:withExtension:) 才找得到
      - path: Sounds
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: BiqiAlarm
        PRODUCT_BUNDLE_IDENTIFIER: com.local.biqialarm
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
